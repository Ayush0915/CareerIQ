[project]
name = "careeriq"
version = "4.1.0"
description = "AI-powered resume analysis, ATS simulation, and career coaching."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Direct dependencies only.  The previous requirements.txt was a `pip freeze`
# dump that pinned 45 transitive packages by hand, which made any single
# upgrade a manual conflict-resolution exercise.  The resolver owns those now.
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "slowapi>=0.1.9",
    # Config & models
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # Document parsing
    "pdfplumber>=0.11",
    "pypdf>=5.1",
    "python-docx>=1.1",
    # NLP / embeddings
    "fastembed>=0.4",
    "numpy>=1.26",
    # HTTP clients
    "httpx>=0.28",
    "requests>=2.32",
    # LLM provider (OpenRouter is OpenAI-compatible)
    "openai>=1.57",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
filterwarnings = ["ignore::DeprecationWarning"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["frontend", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
